[pytest]
# Only unit_tests/ is safe for pytest to collect. integration_tests/ runs real
# SSH/docker/pexpect at *import time* (gated by should_run_appliance()/
# should_run_ncc()), not inside test functions — pytest collecting it directly
# would execute live network calls during collection. Run integration tests
# via `python3 -m nios_test.integration_tests.run_all` instead.
testpaths = unit_tests
addopts = -q
